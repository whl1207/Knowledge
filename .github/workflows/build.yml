name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.spec.js"
      - ".idea"
      - ".vscode"
      - ".dockerignore"
      - "Dockerfile"
      - ".gitignore"
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # 仓库不提交 lockfile（已在 .gitignore 中忽略），这里用 package.json 作为缓存键
          cache-dependency-path: package.json

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64

      - name: Install Dependencies
        run: npm install

      - name: Build Release Files
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS (arm64) 运行器的 Node 默认堆只有约 2GB，vite build 会 OOM 退出（Abort trap: 6），
          # 统一抬高堆上限（与 scripts/build-linux-all.sh 里的 --max-old-space-size 对齐）
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release_${{ matrix.os }}
          path: release/
          retention-days: 5