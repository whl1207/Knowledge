name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.spec.js"
      - ".idea"
      - ".vscode"
      - ".dockerignore"
      - "Dockerfile"
      - ".gitignore"
  pull_request:
    branches: [main]

# 发布 Release 需要 contents: write（仓库默认只读）
permissions:
  contents: write

# 同一分支上的构建串行执行：先推的跑完再跑后推的，保证 Release 里最后留下的是最新一次构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac dmg

    env:
      # macOS(arm64) 运行器 Node 默认堆只有约 2GB，vite build 会 OOM；与本地 Linux 脚本的取值对齐
      NODE_OPTIONS: --max-old-space-size=6144
      # 没有签名证书时跳过 macOS 签名（否则 electron-builder 会尝试查找证书）
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64

      - name: Install Dependencies
        run: npm install

      # 内置 drawio 编辑器（约 65MB）不入库，打包前取一次，保证产物里能打开 / 编辑 .drawio
      - name: Fetch drawio webapp
        run: node scripts/fetch-drawio-webapp.mjs

      - name: Build Release Files
        run: |
          npx vue-tsc --noEmit
          npx vite build
          npx electron-builder ${{ matrix.args }}
          node scripts/rename-unpacked.mjs
          node scripts/collect-release.mjs --skip-rar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 只上传安装包本身（解包目录太大且不需要长期保留）
      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: release_${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 5
          path: |
            release/*.exe
            release/*.deb
            release/*.AppImage
            release/*.dmg

  # 构建成功后把安装包发到 Release（仅 main 分支的 push，PR 不发布）
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Packages
        uses: actions/download-artifact@v4
        with:
          pattern: release_*
          path: packages
          merge-multiple: true

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          shopt -s nullglob
          FILES=(packages/*.exe packages/*.deb packages/*.AppImage packages/*.dmg)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "没有可发布的安装包，跳过"
            exit 0
          fi
          echo "准备发布 $TAG："
          printf '  %s\n' "${FILES[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 已存在同名 Release：只覆盖同名资产（保留手写的发布说明）
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "AI-KM $TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
          gh release view "$TAG" --json tagName,url,assets --jq '"\(.tagName) \(.url)\n" + (.assets[] | "  \(.name)  \(.size)")'
