<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>AI-KM browser e2e</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; }
    #out { margin-top: 12px; color: #1a7f37; }
    iframe { width: 320px; height: 120px; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Browser e2e fixture</h1>
  <label>Name <input id="name" placeholder="Your name" /></label>
  <button id="btn" onclick="document.getElementById('out').textContent = 'clicked ' + (document.getElementById('name').value || '')">Click me</button>
  <div id="out">idle</div>
  <select id="pick">
    <option value="a">Alpha</option>
    <option value="b">Beta</option>
  </select>
  <div id="hover" onmouseenter="this.textContent='hovered'" style="margin-top:12px;padding:6px;border:1px dashed #ccc;">hover me</div>
  <p><a id="dl" download="aikm-e2e.txt" href="data:text/plain,aikm-e2e-download">download fixture</a></p>
  <p><a id="evil" download="evil.exe" href="data:application/octet-stream,not-a-real-exe">blocked fixture</a></p>
  <p>
    <input id="file" type="file" onchange="document.getElementById('fileOut').textContent='files:' + this.files.length" />
    <button id="choose" onclick="document.getElementById('file').click()">Choose file</button>
    <span id="fileOut">none</span>
  </p>
  <div id="pad" style="margin-top:12px;width:180px;height:60px;border:1px solid #999;"
    onmousedown="this.dataset.down='1'"
    onmousemove="if (this.dataset.down) document.getElementById('dragOut').textContent='dragging'"
    onmouseup="this.dataset.down='0';document.getElementById('dragOut').textContent='dragged'">drag pad</div>
  <div id="dragOut">none</div>
  <div id="wheel" onwheel="document.getElementById('wheelOut').textContent='wheeled ' + event.deltaY"
    style="margin-top:12px;width:180px;height:60px;border:1px dashed #999;">wheel area</div>
  <div id="wheelOut">none</div>
  <p><input id="paste" placeholder="paste here" oninput="document.getElementById('pasteOut').textContent=this.value" /><span id="pasteOut">none</span></p>
</body>
</html>
